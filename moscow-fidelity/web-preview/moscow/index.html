<h1>Inn.vision · Москва</h1><p>Начальный сектор 3 × 3 км, остальные районы — по выбору.</p>
<p><a id="viewer" href="../prototype/tiles/?layout=sectors&amp;renderer=webgpu&amp;engine=raster">Открыть Москва</a></p>
<script>
const url=new URL(document.getElementById('viewer').href);
if(!navigator.gpu||matchMedia('(pointer:coarse)').matches){url.searchParams.set('renderer','webgl2');url.searchParams.delete('layout');url.searchParams.set('streaming','camera');}
for(const [key,value] of new URLSearchParams(location.search))url.searchParams.set(key,value);
location.replace(url.href);
</script></html>
