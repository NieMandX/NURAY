name: Deploy NURAY
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check viewer presets, water and tile transport
        working-directory: moscow-fidelity/web-preview
        run: node --test tests/regional-defaults.test.mjs tests/water-settings.test.mjs tests/water-optics.test.mjs tests/packed-mesh.test.mjs tests/scene-layers.test.mjs tests/planar-reflections.test.mjs tests/environment-brdf.test.mjs
      - name: Check transfer integrity and offline restoration
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify published scene objects and byte ranges
        run: python3 scripts/verify_cloud.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: moscow-fidelity/web-preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
